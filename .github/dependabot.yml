version: 2

updates:
  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      python-sdk-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /packages/mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      mcp-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /packages/typescript
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      typescript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: /packages/dart
    schedule:
      interval: weekly
      day: monday
      time: "06:35"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      dart-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /packages/kotlin
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    ignore:
      # Published runtime dependencies are deliberate lower bounds (see
      # gradle/libs.versions.toml); CI already tests the newest releases.
      - dependency-name: "com.squareup.okhttp3:okhttp"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-core"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization-json"
    groups:
      kotlin-dependencies:
        patterns:
          - "*"

  # The Swift SDK has no dependencies today; this entry keeps future ones under review.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      swift-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
