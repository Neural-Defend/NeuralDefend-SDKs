version: 2

updates:
  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      python-sdk-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /packages/mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      mcp-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: mcp
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /packages/typescript
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      typescript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
