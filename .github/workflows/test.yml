name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install Python SDK
        run: python -m pip install "./packages/python[dev]"
      - name: Lint Python SDK
        working-directory: packages/python
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check Python SDK
        working-directory: packages/python
        run: python -m mypy --strict
      - name: Test Python SDK
        working-directory: packages/python
        run: python -m pytest

  mcp:
    name: MCP Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/python/pyproject.toml
            packages/mcp/pyproject.toml
      - name: Install MCP and local SDK
        run: python -m pip install "./packages/python" "./packages/mcp[dev]"
      - name: Lint MCP
        working-directory: packages/mcp
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check MCP
        working-directory: packages/mcp
        run: python -m mypy --strict
      - name: Test MCP
        working-directory: packages/mcp
        run: python -m pytest

  typescript:
    name: TypeScript Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install dependencies
        working-directory: packages/typescript
        run: npm ci
      - name: Lint
        working-directory: packages/typescript
        run: npm run lint
      - name: Type-check
        working-directory: packages/typescript
        run: npm run typecheck
      - name: Build
        working-directory: packages/typescript
        run: npm run build
      - name: Test
        working-directory: packages/typescript
        run: npm test
      - name: Validate package
        working-directory: packages/typescript
        run: |
          npm run validate:package
          npm run pack:dry-run

  python-platforms:
    name: Python 3.14 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install and test Python SDK
        working-directory: packages/python
        run: |
          python -m pip install ".[dev]"
          python -m pytest

  mcp-platforms:
    name: MCP Python 3.14 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            packages/python/pyproject.toml
            packages/mcp/pyproject.toml
      - name: Install and test MCP
        run: |
          python -m pip install "./packages/python" "./packages/mcp[dev]"
          python -m pytest packages/mcp/tests

  typescript-platforms:
    name: TypeScript Node 24 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install and test TypeScript SDK
        working-directory: packages/typescript
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
