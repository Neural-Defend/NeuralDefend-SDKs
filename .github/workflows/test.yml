name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install Python SDK
        run: python -m pip install "./packages/python[dev]"
      - name: Lint Python SDK
        working-directory: packages/python
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check Python SDK
        working-directory: packages/python
        run: python -m mypy --strict
      - name: Test Python SDK
        working-directory: packages/python
        run: python -m pytest

  mcp:
    name: MCP Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/python/pyproject.toml
            packages/mcp/pyproject.toml
      - name: Install MCP and local SDK
        run: python -m pip install "./packages/python" "./packages/mcp[dev]"
      - name: Lint MCP
        working-directory: packages/mcp
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check MCP
        working-directory: packages/mcp
        run: python -m mypy --strict
      - name: Test MCP
        working-directory: packages/mcp
        run: python -m pytest

  typescript:
    name: TypeScript Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install dependencies
        working-directory: packages/typescript
        run: npm ci
      - name: Lint
        working-directory: packages/typescript
        run: npm run lint
      - name: Type-check
        working-directory: packages/typescript
        run: npm run typecheck
      - name: Build
        working-directory: packages/typescript
        run: npm run build
      - name: Test
        working-directory: packages/typescript
        run: npm test
      - name: Validate package
        working-directory: packages/typescript
        run: |
          npm run validate:package
          npm run pack:dry-run

  go:
    name: Go 1.22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache-dependency-path: packages/go/go.mod
      - name: Vet Go SDK
        working-directory: packages/go
        run: go vet ./...
      - name: Test Go SDK
        working-directory: packages/go
        run: go test ./...

  java:
    name: Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: packages/java/build.gradle.kts
      - name: Test Java SDK
        working-directory: packages/java
        run: |
          for attempt in 1 2 3; do
            ./gradlew test && exit 0
            echo "Gradle attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          exit 1

  python-platforms:
    name: Python 3.14 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install and test Python SDK
        working-directory: packages/python
        run: |
          python -m pip install ".[dev]"
          python -m pytest

  mcp-platforms:
    name: MCP Python 3.14 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            packages/python/pyproject.toml
            packages/mcp/pyproject.toml
      - name: Install and test MCP
        run: |
          python -m pip install "./packages/python" "./packages/mcp[dev]"
          python -m pytest packages/mcp/tests

  typescript-platforms:
    name: TypeScript Node 24 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install and test TypeScript SDK
        working-directory: packages/typescript
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
