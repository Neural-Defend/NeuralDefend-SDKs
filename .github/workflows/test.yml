name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install Python SDK
        run: python -m pip install "./packages/python[dev]"
      - name: Lint Python SDK
        working-directory: packages/python
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check Python SDK
        working-directory: packages/python
        run: python -m mypy --strict
      - name: Test Python SDK
        working-directory: packages/python
        run: python -m pytest

  mcp:
    name: MCP Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/python/pyproject.toml
            packages/mcp/pyproject.toml
      - name: Install MCP and local SDK
        run: python -m pip install "./packages/python" "./packages/mcp[dev]"
      - name: Lint MCP
        working-directory: packages/mcp
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type-check MCP
        working-directory: packages/mcp
        run: python -m mypy --strict
      - name: Test MCP
        working-directory: packages/mcp
        run: python -m pytest

  typescript:
    name: TypeScript Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install dependencies
        working-directory: packages/typescript
        run: npm ci
      - name: Lint
        working-directory: packages/typescript
        run: npm run lint
      - name: Type-check
        working-directory: packages/typescript
        run: npm run typecheck
      - name: Build
        working-directory: packages/typescript
        run: npm run build
      - name: Test
        working-directory: packages/typescript
        run: npm test
      - name: Validate package
        working-directory: packages/typescript
        run: |
          npm run validate:package
          npm run pack:dry-run

  go:
    name: Go 1.22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache-dependency-path: packages/go/go.mod
      - name: Vet Go SDK
        working-directory: packages/go
        run: go vet ./...
      - name: Test Go SDK
        working-directory: packages/go
        run: go test ./...

  dart:
    name: Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.5.4", stable]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Dart
        run: python scripts/setup_dart_toolchain.py --dart "${{ matrix.sdk }}"
      - name: Install dependencies
        working-directory: packages/dart
        run: dart pub get
      - name: Check formatting
        if: matrix.sdk == 'stable'
        working-directory: packages/dart
        run: dart format --output=none --set-exit-if-changed lib test tool example
      - name: Analyze
        working-directory: packages/dart
        run: dart analyze --fatal-infos
      - name: Test on the Dart VM
        working-directory: packages/dart
        run: dart test
      - name: Test in Chrome (dart2js and dart2wasm)
        if: matrix.sdk == 'stable'
        working-directory: packages/dart
        run: |
          dart test -p chrome
          dart test -p chrome -c dart2wasm
      - name: Compile for web
        working-directory: packages/dart
        run: |
          dart compile js -o "$RUNNER_TEMP/web_check.js" tool/web_compile_check.dart
          dart compile wasm -o "$RUNNER_TEMP/web_check.wasm" tool/web_compile_check.dart
      - name: Validate package
        working-directory: packages/dart
        run: dart pub publish --dry-run

  flutter-example:
    name: Flutter example ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        flutter: ["3.24.x", stable]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Flutter
        run: python scripts/setup_dart_toolchain.py --flutter "${{ matrix.flutter }}"
      - name: Prepare Flutter
        run: |
          flutter config --no-analytics
          flutter --version
      - name: Install dependencies
        working-directory: packages/dart/example/flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: packages/dart/example/flutter_app
        run: flutter analyze
      - name: Widget tests
        working-directory: packages/dart/example/flutter_app
        run: flutter test
      - name: Build for web
        working-directory: packages/dart/example/flutter_app
        run: |
          flutter create --platforms=web --project-name neuraldefend_flutter_example .
          flutter build web

  dart-platforms:
    name: Dart stable ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Dart
        shell: bash
        run: python scripts/setup_dart_toolchain.py --dart stable
      - name: Install and test Dart SDK
        working-directory: packages/dart
        shell: bash
        run: |
          dart pub get
          dart test

  swift-linux:
    name: Swift ${{ matrix.swift }} Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 6.0.3 is the oldest supported toolchain; "latest" resolves from swift.org.
        swift: ["6.0.3", latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Swift
        run: python3 scripts/setup_swift_toolchain.py "${{ matrix.swift }}"
      - name: Show toolchain
        run: swift --version
      - name: Check formatting
        if: matrix.swift == '6.0.3'
        run: swift format lint --strict --recursive Package.swift packages/swift/Sources packages/swift/Tests packages/swift/Examples
      - name: Test Swift SDK
        run: swift test -Xswiftc -warnings-as-errors
      - name: Test SwiftUI example model
        working-directory: packages/swift/Examples/NeuroVerifyDemo
        run: swift test -Xswiftc -warnings-as-errors

  swift-apple:
    name: Swift Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 16.0 ships Swift 6.0, the oldest supported toolchain.
          - os: macos-15
            xcode: "16.0"
          - os: macos-latest
            xcode: default
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        if: matrix.xcode != 'default'
        run: sudo xcode-select --switch "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list
      - name: Test Swift SDK on macOS
        run: swift test -Xswiftc -warnings-as-errors
      - name: Pick an iOS Simulator
        shell: bash
        run: |
          destination="$(xcodebuild -showdestinations -scheme NeuralDefend 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep 'name:iPhone' | grep -v Placeholder \
            | head -n 1 | sed -E 's/.*id:([^,]+),.*/\1/')"
          if [[ -z "$destination" ]]; then
            xcodebuild -showdestinations -scheme NeuralDefend
            echo "::error::No iOS Simulator is available for this Xcode."
            exit 1
          fi
          echo "IOS_SIMULATOR_ID=$destination" >> "$GITHUB_ENV"
      - name: Test Swift SDK on the iOS Simulator
        run: |
          xcodebuild test -scheme NeuralDefend -destination "id=$IOS_SIMULATOR_ID" \
            -skipPackagePluginValidation SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build for Mac Catalyst
        run: |
          xcodebuild build -scheme NeuralDefend -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -skipPackagePluginValidation SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Test SwiftUI example on macOS
        working-directory: packages/swift/Examples/NeuroVerifyDemo
        run: swift test -Xswiftc -warnings-as-errors
      - name: Test SwiftUI example on the iOS Simulator
        working-directory: packages/swift/Examples/NeuroVerifyDemo
        run: |
          xcodebuild test -scheme NeuroVerifyDemo -destination "id=$IOS_SIMULATOR_ID" \
            -skipPackagePluginValidation SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

  python-platforms:
    name: Python 3.14 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install and test Python SDK
        working-directory: packages/python
        run: |
          python -m pip install ".[dev]"
          python -m pytest

  mcp-platforms:
    name: MCP Python 3.14 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            packages/python/pyproject.toml
            packages/mcp/pyproject.toml
      - name: Install and test MCP
        run: |
          python -m pip install "./packages/python" "./packages/mcp[dev]"
          python -m pytest packages/mcp/tests

  typescript-platforms:
    name: TypeScript Node 24 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install and test TypeScript SDK
        working-directory: packages/typescript
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
