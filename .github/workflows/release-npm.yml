name: Release TypeScript SDK

on:
  push:
    tags:
      - "ts-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate only; manual runs never publish
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enforce manual dry-run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo "::error::workflow_dispatch is restricted to an explicit dry run."
          exit 1
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#ts-v}"
          actual="$(node -p 'require("./packages/typescript/package.json").version')"
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Tag version '$expected' does not match npm package version '$actual'."
            exit 1
          fi
      - name: Validate package version consistency
        run: python scripts/validate_versions.py
      - name: Require release tag on the default branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}" || {
            echo "::error::Release tags must point to a commit on the default branch."
            exit 1
          }
      - name: Install dependencies
        working-directory: packages/typescript
        run: npm ci
      - name: Test and validate package
        working-directory: packages/typescript
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm run validate:package
          npm run pack:dry-run
      - name: Build npm tarball
        working-directory: packages/typescript
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          npm pack --pack-destination "${{ github.workspace }}/dist"
      - name: Inspect npm tarball
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/*.tgz)
          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one npm tarball."
            exit 1
          fi
          tar -tzf "${artifacts[0]}"
          tar -tzf "${artifacts[0]}" | awk '
            $0 == "package/dist/index.js" { esm = 1 }
            $0 == "package/dist/index.cjs" { cjs = 1 }
            $0 == "package/dist/index.d.ts" { types = 1 }
            END { exit !(esm && cjs && types) }
          '
      - name: Scan npm tarball for forbidden content
        run: python scripts/scan_public_artifacts.py dist
      - name: Extract npm tarball for SBOM analysis
        run: |
          mkdir -p sbom/typescript-root
          tar -xzf dist/*.tgz -C sbom/typescript-root
      - name: Generate SBOM with digest-pinned Syft
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          anchore/syft@sha256:13b53ebabe3d215268c90cf8fb9b875f0183908245f376fd4b3a2cb69d21d484
          dir:/repo/sbom/typescript-root
          --output cyclonedx-json=/repo/sbom/typescript-sdk.cdx.json
      - name: Clean-install npm tarball
        shell: bash
        run: |
          mkdir release-consumer
          cd release-consumer
          npm init -y >/dev/null
          npm install ../dist/*.tgz
          node --input-type=module -e "import { NeuroVerifyClient } from '@neuraldefend/sdk'; if (!NeuroVerifyClient) process.exit(1)"
          node -e "if (!require('@neuraldefend/sdk').NeuroVerifyClient) process.exit(1)"
      - name: Upload npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-sbom
          path: sbom/typescript-sdk.cdx.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install trusted-publishing-capable npm
        run: npm install --global npm@11.6.2
      - name: Download npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: dist
      - name: Download release SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-sbom
          path: sbom
      - name: Attest npm tarball
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tgz
      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.tgz
          sbom-path: sbom/typescript-sdk.cdx.json
      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#ts-v}"
          if [[ "$version" == *-* ]]; then
            npm publish ./dist/*.tgz --access public --provenance --tag next
          else
            npm publish ./dist/*.tgz --access public --provenance
          fi
