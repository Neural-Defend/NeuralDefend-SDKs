name: Check generated sources

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: generated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints/spec-tools.txt
      - name: Install spec tooling dependency
        run: python -m pip install --require-hashes -r constraints/spec-tools.txt
      - name: Validate specification
        run: python scripts/validate_spec.py
      - name: Test spec tooling
        run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Scan publishable source for forbidden content
        run: python scripts/scan_public_artifacts.py
      - name: Validate package version consistency
        run: python scripts/validate_versions.py
      - name: Pull pinned generator image
        run: |
          image="$(python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("generator/config.json").read_text(encoding="utf-8"))
          print(f"{config['image_repository']}@{config['image_digest']}")
          PY
          )"
          docker pull "$image"
      - name: Verify checked-in generation
        run: python scripts/check_generated.py
      - name: Verify generation is idempotent twice
        shell: bash
        run: |
          assert_clean() {
            git diff --exit-code
            status="$(git status --porcelain --untracked-files=all)"
            if [[ -n "$status" ]]; then
              printf '%s\n' "$status"
              echo "Generation left untracked or modified files." >&2
              exit 1
            fi
          }

          python scripts/generate.py
          assert_clean
          python scripts/generate.py
          assert_clean
