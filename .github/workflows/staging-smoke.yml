name: Staging smoke tests

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require staging API key
        env:
          STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
        run: |
          if [[ -z "$STAGING_API_KEY" ]]; then
            echo "::error::NEURALDEFEND_STAGING_API_KEY is required by the protected staging environment."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints/release.txt
      - name: Install hash-locked Python smoke dependencies
        run: |
          python -m pip install --require-hashes -r constraints/release.txt
          python -m pip install --no-deps --no-build-isolation ./packages/python ./packages/mcp
      - name: Generate approved synthetic no-face fixtures
        shell: bash
        run: |
          python - <<'PY'
          import struct
          import zlib
          from pathlib import Path

          path = Path("${{ runner.temp }}") / "neuraldefend-smoke.png"
          width = height = 256
          rows = b"".join(b"\x00" + b"\x00\x00\x00" * width for _ in range(height))

          def chunk(kind: bytes, data: bytes) -> bytes:
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          path.write_bytes(
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(rows))
              + chunk(b"IEND", b"")
          )
          PY
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=${{ runner.temp }},target=/fixtures" \
            jrottenberg/ffmpeg@sha256:8ec1ee1f6a0fcd37c97725827b6b7832795c9596e3439b8da56d7700d61ae778 \
            -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=320x240:d=1 \
            -c:v libx264 -pix_fmt yuv420p -an -y \
            /fixtures/neuraldefend-smoke.mp4
      - name: Run Python SDK smoke tests
        working-directory: packages/python
        env:
          NEURALDEFEND_STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
          NEURALDEFEND_STAGING_IMAGE: ${{ runner.temp }}/neuraldefend-smoke.png
          NEURALDEFEND_STAGING_VIDEO: ${{ runner.temp }}/neuraldefend-smoke.mp4
        run: python -m pytest -m staging
      - name: Run MCP smoke tests
        working-directory: packages/mcp
        env:
          NEURALDEFEND_STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
          NEURALDEFEND_MCP_ALLOWED_DIRS: ${{ runner.temp }}
          NEURALDEFEND_MCP_ENVIRONMENT: staging
          NEURALDEFEND_STAGING_IMAGE: ${{ runner.temp }}/neuraldefend-smoke.png
          NEURALDEFEND_STAGING_VIDEO: ${{ runner.temp }}/neuraldefend-smoke.mp4
        run: python -m pytest -m staging
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install locked Node.js smoke dependencies
        working-directory: packages/typescript
        run: npm ci
      - name: Run TypeScript smoke tests
        working-directory: packages/typescript
        env:
          NEURALDEFEND_STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
          NEURALDEFEND_STAGING_IMAGE: ${{ runner.temp }}/neuraldefend-smoke.png
          NEURALDEFEND_STAGING_VIDEO: ${{ runner.temp }}/neuraldefend-smoke.mp4
        run: npm run test:smoke
