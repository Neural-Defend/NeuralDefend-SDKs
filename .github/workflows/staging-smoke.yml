name: Staging smoke tests

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      NEURALDEFEND_STAGING_IMAGE: ${{ github.workspace }}/tests/fixtures/media/ai-generated.png
      NEURALDEFEND_STAGING_VIDEO: ${{ github.workspace }}/tests/fixtures/media/fake-video.mp4
      NEURALDEFEND_MCP_ALLOWED_DIRS: ${{ github.workspace }}/tests/fixtures/media
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require staging API key
        env:
          STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
        run: |
          if [[ -z "$STAGING_API_KEY" ]]; then
            echo "::error::NEURALDEFEND_STAGING_API_KEY is required by the protected staging environment."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints/release.txt
      - name: Install hash-locked Python smoke dependencies
        run: |
          python -m pip install --require-hashes -r constraints/release.txt
          python -m pip install --no-deps --no-build-isolation ./packages/python ./packages/mcp
      - name: Verify checked-in smoke fixtures
        run: |
          test -f tests/fixtures/media/ai-generated.png
          test -f tests/fixtures/media/fake-video.mp4
          test -f tests/fixtures/media/manifest.json
      - name: Run Python SDK smoke tests
        working-directory: packages/python
        env:
          NEURALDEFEND_STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
        run: python -m pytest -m staging
      - name: Run MCP smoke tests
        working-directory: packages/mcp
        env:
          NEURALDEFEND_STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
          NEURALDEFEND_MCP_ENVIRONMENT: staging
        run: python -m pytest -m staging
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install locked Node.js smoke dependencies
        working-directory: packages/typescript
        run: npm ci
      - name: Run TypeScript smoke tests
        working-directory: packages/typescript
        env:
          NEURALDEFEND_STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
        run: npm run test:smoke
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
          cache-dependency-path: packages/go/go.mod
      - name: Run Go SDK smoke tests
        working-directory: packages/go
        env:
          NEURALDEFEND_STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
        run: go test -run 'TestStaging' ./...
      - name: Set up Java
        uses: actions/setup-java@5a1d4880be5123bb1759d575b062b24da689abab # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: packages/java/build.gradle.kts
      - name: Run Java SDK smoke tests
        working-directory: packages/java
        env:
          NEURALDEFEND_STAGING_API_KEY: ${{ secrets.NEURALDEFEND_STAGING_API_KEY }}
        run: ./gradlew test --tests 'com.neuraldefend.StagingSmokeTest'
