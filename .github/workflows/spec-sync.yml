name: Sync public specification

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spec-sync
  cancel-in-progress: false

env:
  SDK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  SPEC_SOURCE_REPOSITORY: ${{ vars.SPEC_SOURCE_REPOSITORY }}
  SPEC_SOURCE_REF: ${{ vars.SPEC_SOURCE_REF }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SDK_DEFAULT_BRANCH }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints/spec-tools.txt
      - name: Require private-repository token
        env:
          SYNC_TOKEN: ${{ secrets.SDK_SPEC_SYNC_TOKEN }}
        run: |
          if [[ -z "$SPEC_SOURCE_REPOSITORY" ]]; then
            echo "::error::Repository variable SPEC_SOURCE_REPOSITORY is required."
            exit 1
          fi
          if [[ -z "$SPEC_SOURCE_REF" ]]; then
            echo "::error::Repository variable SPEC_SOURCE_REF must name the production API branch."
            exit 1
          fi
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::SDK_SPEC_SYNC_TOKEN is required because GITHUB_TOKEN cannot read the private API repository."
            exit 1
          fi
      - name: Install spec tooling dependency
        run: python -m pip install --require-hashes -r constraints/spec-tools.txt
      - name: Synchronize from private API repository
        env:
          GH_TOKEN: ${{ secrets.SDK_SPEC_SYNC_TOKEN }}
        run: >-
          python scripts/sync_spec.py
          --from-github
          "${SPEC_SOURCE_REPOSITORY}@${SPEC_SOURCE_REF}"
      - name: Detect specification changes
        id: spec
        shell: bash
        run: |
          if git diff --quiet -- spec; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull pinned generator image
        if: steps.spec.outputs.changed == 'true'
        run: |
          image="$(python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("generator/config.json").read_text(encoding="utf-8"))
          print(f"{config['image_repository']}@{config['image_digest']}")
          PY
          )"
          docker pull "$image"
      - name: Regenerate SDK cores
        if: steps.spec.outputs.changed == 'true'
        run: python scripts/generate.py
      - name: Validate synchronized result
        if: steps.spec.outputs.changed == 'true'
        run: |
          python scripts/validate_spec.py
          python -m unittest discover -s scripts/tests -p "test_*.py"
          python scripts/check_generated.py
      - name: Read synchronized commit
        if: steps.spec.outputs.changed == 'true'
        id: source
        shell: bash
        run: |
          sha="$(python -c 'import json; print(json.load(open("spec/SPEC_SOURCE.json", encoding="utf-8"))["resolved_commit"])')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"
      - name: Open synchronization pull request
        if: steps.spec.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_SHORT_SHA: ${{ steps.source.outputs.short_sha }}
        shell: bash
        run: |
          gh auth setup-git
          title="spec: sync from ${SOURCE_SHA}"
          existing="$(gh pr list --state open --json title,url \
            --jq "[.[] | select(.title == \"${title}\")][0].url // \"\"")"
          if [[ -n "$existing" ]]; then
            echo "An open synchronization PR already exists: $existing"
            exit 0
          fi

          branch="automation/spec-sync-${SOURCE_SHORT_SHA}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add -- spec packages/python/src/neuraldefend/_core packages/typescript/src/core
          git commit -m "$title"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "$SDK_DEFAULT_BRANCH" \
            --head "$branch" \
            --title "$title" \
            --body "$(cat <<EOF
          ## Summary
          - synchronize the public OpenAPI contract from the configured private API repository
          - record source commit \`${SOURCE_SHA}\`
          - regenerate the checked-in Python and TypeScript cores

          ## Validation
          - \`python scripts/validate_spec.py\`
          - script unit tests
          - \`python scripts/check_generated.py\`
          EOF
          )"
