name: Dependency security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "29 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history-secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with pinned Gitleaks image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

  python-audit:
    name: pip-audit Python SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install package and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./packages/python" pip-audit
      - name: Generate CycloneDX SBOM
        run: pip-audit --local --format cyclonedx-json --output python-sbom.cdx.json
      - name: Audit installed dependencies
        run: pip-audit --local
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sbom
          path: python-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  mcp-audit:
    name: pip-audit MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packages/python/pyproject.toml
            packages/mcp/pyproject.toml
      - name: Install packages and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./packages/python" "./packages/mcp" pip-audit
      - name: Generate CycloneDX SBOM
        run: pip-audit --local --format cyclonedx-json --output mcp-sbom.cdx.json
      - name: Audit installed dependencies
        run: pip-audit --local
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-sbom
          path: mcp-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  npm-audit:
    name: npm audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install locked dependencies
        working-directory: packages/typescript
        run: npm ci
      - name: Generate CycloneDX SBOM
        working-directory: packages/typescript
        run: npm sbom --sbom-format cyclonedx > npm-sbom.cdx.json
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-sbom
          path: packages/typescript/npm-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Audit npm dependencies
        working-directory: packages/typescript
        run: npm audit --audit-level=low
