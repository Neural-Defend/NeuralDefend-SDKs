[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "neuraldefend-mcp"
version = "2.0.0"
description = "Secure MCP server for Neural Defend NeuroVerify — deepfake and AI-generated media detection for MCP agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Neural Defend" }]
keywords = [
  "neuraldefend",
  "neural-defend",
  "neuroverify",
  "deepfake",
  "deepfake-detection",
  "deepfake-detection-api",
  "ai-detection",
  "ai-generated-content",
  "ai-generated-image-detection",
  "ai-generated-video-detection",
  "ai-image-detection",
  "ai-video-detection",
  "synthetic-media-detection",
  "generative-ai-detection",
  "media-authenticity",
  "media-forensics",
  "image-authenticity",
  "video-authenticity",
  "face-authenticity",
  "spoof-detection",
  "manipulation-detection",
  "model-context-protocol",
  "mcp",
  "ai-agent",
  "llm-tools",
  "identity-verification",
  "fraud-prevention",
  "media",
  "authenticity",
  "fraud",
  "security",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "anyio>=4.14.2,<5",
  "mcp>=2.0.0,<3",
  "neuraldefend>=1.0.3,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.5.0",
  "mypy>=2.3.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff==0.16.1",
  "twine>=7.0.0",
]

[project.scripts]
neuraldefend-mcp = "neuraldefend_mcp.server:main"

[project.urls]
Homepage = "https://neuraldefend.com/"
Repository = "https://github.com/Neural-Defend/NeuralDefend-SDKs"
Documentation = "https://github.com/Neural-Defend/NeuralDefend-SDKs/tree/main/packages/mcp"
Issues = "https://github.com/Neural-Defend/NeuralDefend-SDKs/issues"
Changelog = "https://github.com/Neural-Defend/NeuralDefend-SDKs/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/neuraldefend_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "staging: opt-in live call to the protected staging API",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/neuraldefend_mcp"]
warn_unreachable = true
