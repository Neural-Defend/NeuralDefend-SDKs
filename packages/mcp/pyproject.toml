[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neuraldefend-mcp"
version = "1.0.0"
description = "Secure MCP server for the NeuroVerify media authenticity API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Neural Defend" }]
keywords = ["mcp", "media", "authenticity", "fraud", "security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4,<5",
  "mcp>=1.28,<2",
  "neuraldefend>=1,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff==0.16.0",
  "twine>=5",
]

[project.scripts]
neuraldefend-mcp = "neuraldefend_mcp.server:main"

[project.urls]
Documentation = "https://github.com/Neural-Defend/NeuralDefend-SDKs/tree/main/packages/mcp"
Issues = "https://github.com/Neural-Defend/NeuralDefend-SDKs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/neuraldefend_mcp"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "staging: opt-in live call to the protected staging API",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/neuraldefend_mcp"]
warn_unreachable = true
