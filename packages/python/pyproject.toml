[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neuraldefend"
version = "1.0.3"
description = "Official Python SDK for Neural Defend NeuroVerify — deepfake, AI-generated image/video, and media authenticity detection"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Neural Defend" }]
keywords = [
  "neuraldefend",
  "neural-defend",
  "neuroverify",
  "deepfake",
  "deepfake-detection",
  "deepfake-detection-api",
  "ai-detection",
  "ai-generated-content",
  "ai-generated-image-detection",
  "ai-generated-video-detection",
  "ai-image-detection",
  "ai-video-detection",
  "synthetic-media-detection",
  "generative-ai-detection",
  "media-authenticity",
  "media-forensics",
  "image-authenticity",
  "video-authenticity",
  "face-authenticity",
  "spoof-detection",
  "manipulation-detection",
  "identity-verification",
  "fraud-prevention",
  "kyc",
  "computer-vision",
  "ai",
  "media",
  "authenticity",
  "fraud",
  "security",
  "sdk",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "python-dateutil>=2.8,<3",
  "typing-extensions>=4.7",
  "urllib3>=2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10,<3",
  "pytest>=8",
  "ruff==0.16.5",
  "twine>=5",
]

[project.urls]
Homepage = "https://neuraldefend.com/"
Repository = "https://github.com/Neural-Defend/NeuralDefend-SDKs"
Documentation = "https://github.com/Neural-Defend/NeuralDefend-SDKs/tree/main/packages/python"
Issues = "https://github.com/Neural-Defend/NeuralDefend-SDKs/issues"
Changelog = "https://github.com/Neural-Defend/NeuralDefend-SDKs/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/neuraldefend"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "staging: opt-in live call to the protected staging API",
]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["src/neuraldefend/_core"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/neuraldefend"]
exclude = ["src/neuraldefend/_core"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["_pytest", "_pytest.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["anyio", "anyio.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["click", "click.*"]
follow_imports = "skip"
